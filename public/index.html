<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteSaathi-AI | Election Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f5a623;
            --primary-dark: #e09612;
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.7);
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border: rgba(255, 255, 255, 0.1);
            --bot-bubble: rgba(48, 54, 61, 0.8);
            --user-bubble: rgba(245, 166, 35, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1a222c 0%, #0d1117 70%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(22, 27, 34, 0.9);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 10px #3fb950;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            background: rgba(22, 27, 34, 0.9);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #30363d;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #a371f7;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
        
        .ai-mode-active .status-dot {
            background-color: #a371f7;
            box-shadow: 0 0 10px #a371f7;
        }
        
        .ai-mode-active .header-title h1 {
            color: #a371f7;
            text-shadow: 0 0 10px rgba(163, 113, 247, 0.3);
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(245, 166, 35, 0.2);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(245, 166, 35, 0.3);
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:active {
            transform: scale(0.95);
        }
        
        .loading {
            align-self: flex-start;
            display: none;
            gap: 5px;
            padding: 12px 16px;
            background: var(--bot-bubble);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }
        
        .loading.active {
            display: flex;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container" id="chat-wrapper">
        <div class="chat-header">
            <div class="header-title">
                <div class="status-dot"></div>
                <h1>VoteSaathi-AI</h1>
            </div>
            <div class="toggle-container">
                <span>AI Mode</span>
                <label class="switch">
                    <input type="checkbox" id="ai-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- Messages will appear here -->
            <div class="loading" id="loading-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type a number or message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const aiToggle = document.getElementById('ai-toggle');
        const chatWrapper = document.getElementById('chat-wrapper');

        let currentState = 'menu';
        let isAiMode = false;

        aiToggle.addEventListener('change', (e) => {
            isAiMode = e.target.checked;
            if (isAiMode) {
                chatWrapper.classList.add('ai-mode-active');
                appendMessage("AI Mode Activated ✨ You can now ask me any open questions about voting, required documents, or procedures.", 'bot');
            } else {
                chatWrapper.classList.remove('ai-mode-active');
                appendMessage("Switched back to Menu Mode. Type 'menu' to see options.", 'bot');
                currentState = 'menu';
            }
        });

        function formatMessage(text) {
            // Very simple markdown to HTML conversion for bold and lists
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n\*/g, '<br>•');
            formatted = formatted.replace(/\n-/g, '<br>•');
            return formatted;
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            if (sender === 'bot') {
                msgDiv.innerHTML = formatMessage(text);
            } else {
                msgDiv.textContent = text;
            }
            chatMessages.insertBefore(msgDiv, loadingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage(messageText = '') {
            if (!messageText && userInput.value.trim() === '') return;
            
            const text = messageText || userInput.value.trim();
            if(!messageText) {
                appendMessage(text, 'user');
                userInput.value = '';
            }

            loadingIndicator.classList.add('active');
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const endpoint = isAiMode ? '/ai' : '/chat';
                const body = isAiMode ? { message: text } : { message: text, state: currentState };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();
                
                loadingIndicator.classList.remove('active');
                appendMessage(data.reply, 'bot');
                if (!isAiMode && data.state) {
                    currentState = data.state;
                }
            } catch (error) {
                loadingIndicator.classList.remove('active');
                appendMessage("Sorry, I'm having trouble connecting to the server.", 'bot');
                console.error('Chat error:', error);
            }
        }

        sendBtn.addEventListener('click', () => sendMessage());

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initialize chat
        window.addEventListener('load', () => {
            sendMessage('menu');
        });
    </script>
</body>
</html>
